[package]
name = "episim-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight epidemiological simulation engine"
readme = "README.md"
repository = "https://github.com/Txxhnd/episim-core"
license = "MIT"
keywords = ["epidemiology", "simulation", "sir", "seir", "ode"]
categories = ["science", "simulation", "mathematics"]
# Ship the crate and its documentation only, not project planning documents.
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/examples/**/*.rs",
    "/benches/**/*.rs",
    "/docs/**/*.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "simulation_bench"
harness = false
